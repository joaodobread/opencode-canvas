name: Bug report
description: Something in the plugin or the preview UI does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Screenshots help for UI problems.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Ask the agent for ...\n2. Click ...\n3. ..."
  - type: input
    id: plugin
    attributes:
      label: opencode-canvas version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: opencode
    attributes:
      label: OpenCode version
      description: Output of `opencode --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and browser
      placeholder: "macOS 15, Chrome 130"
